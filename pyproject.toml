[project]
name = "arr"
version = "0.1.0"
description = "CLI torrent search/download/import client for movies and TV via public indexers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "guessit>=3.8",
    "rich>=13.7",
    "tomli; python_version<'3.11'",
    "curl-cffi>=0.16.3",
    "selectolax>=1.0.0",
    "playwright>=1.40",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "websockets>=16.1.1",
]

[project.scripts]
arr = "arr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arr"]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring a real transmission-daemon (deselected by default)",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100
extend-exclude = ["agent", "logs", ".venv", "/arr"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
