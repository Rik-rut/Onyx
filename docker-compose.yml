name: arr
services:
  arr:
    image: arr:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arr
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
      - "${TRANSMISSION_PORT:-9091}:9091"
      - "51413:51413"
      - "51413:51413/udp"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_DIR:-./config}:/config
      - ${MOVIES_DIR:-./downloads/movies}:/downloads/movies
      - ${TV_SHOWS_DIR:-./downloads/tv-shows}:/downloads/tv-shows
    x-casaos:
      envs:
        - container: PUID
          description:
            en_us: User ID for permissions
        - container: PGID
          description:
            en_us: Group ID for permissions
        - container: TZ
          description:
            en_us: System Timezone
      volumes:
        - container: /config
          description:
            en_us: Configuration files and SQLite database
        - container: /downloads/movies
          description:
            en_us: Destination directory for downloaded Movies
        - container: /downloads/tv-shows
          description:
            en_us: Destination directory for downloaded TV Shows
      ports:
        - container: 8080
          description:
            en_us: ARR Web Dashboard port
        - container: 9091
          description:
            en_us: Transmission Web UI / RPC port
      author: ARR Team
      category: Media
      icon: https://raw.githubusercontent.com/WalkxCode/Dashboard-Icons/main/png/sonarr.png
      title:
        en_us: ARR Shows & Movies Downloader
      tagline:
        en_us: Automated Movie & TV Torrent Downloader & Library Manager
      description:
        en_us: Autonomous BitTorrent media discovery, quality ranking, subtitle fetching, and Sonarr/Radarr library organizer.
      index: /
      port_map: "8080"
